name: Feature request
description: Propose an enhancement to Docora or create-docora.
title: '[feat] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: Please search existing issues before opening a new request.
  - type: dropdown
    id: package
    attributes:
      label: Area
      options:
        - Theme (`docora`)
        - CLI (`create-docora`)
        - Documentation
        - AI / MCP / assistant
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who is blocked today without it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Include API sketches or examples if you have them.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, or existing workarounds.
